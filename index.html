  <style>
    :root {
      --bg: #f7f5f0;
      --paper: #fff;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #ddd8ce;
      --accent: #3d6b8c;
      --accent-hover: #2d5068;
      --overlay: rgba(26, 26, 26, 0.35);
      --header-h: 52px;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    .site-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1;
      flex-shrink: 0;
    }
    .header-start {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-width: 0;
    }
    .site-logo {
      height: 2rem;
      width: auto;
      max-width: 2.25rem;
      object-fit: contain;
      object-position: right center;
      flex-shrink: 0;
      display: block;
      background: transparent;
    }
    .header-end {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .home-btn {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      cursor: pointer;
      font-size: 1.05rem;
      line-height: 1;
      color: var(--accent);
    }
    .home-btn:hover,
    .share-btn:hover {
      background: var(--bg);
      color: var(--accent-hover);
    }
    .share-btn {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      cursor: pointer;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .share-btn svg {
      width: 1rem;
      height: 1rem;
    }
    .build-meta {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--paper);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }
    .sidebar-hint {
      padding: 0.65rem 0.85rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .loc-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 0.85rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .loc-btn:hover,
    .loc-btn.active {
      background: #eef3f6;
    }
    .loc-btn.active {
      border-left: 3px solid var(--accent);
      padding-left: calc(0.85rem - 3px);
    }
    .loc-btn .title {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .loc-btn .region {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .loc-btn[hidden],
    .loc-btn.is-offscreen {
      display: none !important;
    }
    #map {
      flex: 1;
      min-width: 0;
      background: #e8e4dc;
    }
    #map .leaflet-container {
      touch-action: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-emoji {
      background: none;
      border: none;
    }
    .pin-emoji span {
      display: block;
      font-size: 1.5rem;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
      cursor: pointer;
    }
    .marker-cluster {
      background-clip: padding-box;
      border-radius: 50%;
    }
    .marker-cluster div {
      width: 30px;
      height: 30px;
      margin-left: 5px;
      margin-top: 5px;
      border-radius: 50%;
      font: 600 13px/30px system-ui, -apple-system, sans-serif;
      color: #fff;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.28);
    }
    .marker-cluster-sm {
      background-color: rgba(61, 107, 140, 0.28);
    }
    .marker-cluster-sm div {
      background-color: rgba(61, 107, 140, 0.92);
    }
    .marker-cluster-md {
      background-color: rgba(201, 122, 46, 0.28);
    }
    .marker-cluster-md div {
      background-color: rgba(201, 122, 46, 0.92);
    }
    .marker-cluster-lg {
      background-color: rgba(160, 69, 69, 0.28);
    }
    .marker-cluster-lg div {
      background-color: rgba(160, 69, 69, 0.92);
    }
    /* Floating panel */
    .panel {
      position: fixed;
      top: var(--header-h);
      right: 0;
      width: min(420px, 100vw);
      height: calc(100% - var(--header-h));
      background: var(--paper);
      border-left: 1px solid var(--line);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.12);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }
    .panel.open {
      transform: translateX(0);
    }
    .panel-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: var(--overlay);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .panel-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-header-text { flex: 1; min-width: 0; }
    .panel-header h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .panel-header .region {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .panel-close {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--muted);
    }
    .panel-close:hover { background: var(--bg); color: var(--ink); }
    .panel-notes {
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-embed {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .panel-section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .panel-gmaps-wrap {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #e8e4dc;
      flex-shrink: 0;
    }
    .panel-gmaps-wrap iframe {
      display: block;
      width: 100%;
      height: 200px;
      border: 0;
    }
    .panel-gmaps-link {
      margin: 0;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .panel-gmaps-link a {
      color: var(--accent);
    }
    .panel-gmaps-link a:hover {
      color: var(--accent-hover);
    }
    .panel-instagram-wrap {
      flex-shrink: 0;
    }
    .panel-embed .instagram-media {
      margin: 0 !important;
      min-width: 280px !important;
      width: 100% !important;
      max-width: 100% !important;
    }
    .panel-embed .embed-loading {
      color: var(--muted);
      font-size: 0.875rem;
      padding: 2rem 1rem;
      text-align: center;
    }
    .panel-footer {
      padding: 0.65rem 1rem;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
    }
    .panel-footer a,
    .panel-share-btn {
      font-size: 0.8rem;
      color: var(--accent);
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
      font: inherit;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }
    .panel-footer a:hover,
    .panel-share-btn:hover { color: var(--accent-hover); }
    .panel-share-btn svg {
      width: 0.9rem;
      height: 0.9rem;
    }
    .share-toast {
      position: fixed;
      bottom: 1.25rem;
      left: 50%;
      transform: translateX(-50%) translateY(120%);
      background: var(--ink);
      color: #fff;
      font-size: 0.85rem;
      padding: 0.55rem 0.9rem;
      border-radius: 6px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
      z-index: 1100;
      opacity: 0;
      transition: transform 0.2s ease, opacity 0.2s ease;
      pointer-events: none;
    }
    .share-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    @media (max-width: 720px) {
      .sidebar { display: none; }
      .panel { width: 100vw; }
    }
  </style>
</head>

        <button type="button" class="share-btn" id="header-share-btn" aria-label="Share map" title="Share map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 16V4"/>
            <path d="m7 9 5-5 5 5"/>
            <path d="M5 20h14"/>

        </button>
      </div>
      <div class="header-end">

    <div class="main">

      <div id="map" role="application" aria-label="Locations map"></div>
    </div>
  </div>

  <div class="panel-backdrop" id="backdrop" hidden></div>
  <aside class="panel" id="panel" aria-label="Location details" aria-hidden="true">

    <p class="panel-notes" id="panel-notes"></p>
    <div class="panel-embed" id="panel-embed">

    <div class="panel-footer">

    var panel = document.getElementById('panel');
    var backdrop = document.getElementById('backdrop');
    var sidebar = document.getElementById('sidebar');
    var markers = {};
    var activeId = null;
    var locById = {};
    var suppressHashUpdate = false;
    var hashSyncTimer = null;
    var sidebarViewTimer = null;
    var locButtons = {};
    var sidebarHint = null;

    LOCATIONS.forEach(function (loc) {
      locById[loc.id] = loc;
    });

    function scheduleSidebarUpdate() {
      clearTimeout(sidebarViewTimer);
      sidebarViewTimer = setTimeout(updateSidebarForMapView, 100);
    }

    function updateSidebarForMapView() {
      if (!map || !sidebarHint) return;
      if (!map.getBounds || !map.getBounds().isValid()) return;
      var mapBounds = map.getBounds();
      var visible = 0;
      LOCATIONS.forEach(function (loc) {
        var btn = locButtons[loc.id];
        if (!btn) return;
        var inView = mapBounds.contains([loc.lat, loc.lng]);
        var show = inView || loc.id === activeId;
        if (show) visible++;
        btn.classList.toggle('is-offscreen', !show);
        if (show) {
          btn.removeAttribute('hidden');
        } else {
          btn.setAttribute('hidden', '');
        }
      });
      if (visible === 0 && !activeId) {
        sidebarHint.textContent = 'No spots in this view · pan or zoom out';
      } else if (visible === LOCATIONS.length) {
        sidebarHint.textContent = visible + ' saved spots';
      } else {
        sidebarHint.textContent = visible + ' in view · ' + LOCATIONS.length + ' total';
      }
    }

    var shareToastTimer = null;

    function showShareToast(message) {
      var toast = document.getElementById('share-toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(shareToastTimer);
      shareToastTimer = setTimeout(function () {
        toast.classList.remove('show');
      }, 2200);
    }

    function parseHashState() {
      var raw = location.hash.replace(/^#/, '');
      if (!raw) return null;
      var params = new URLSearchParams(raw);
      var state = {};
      var loc = params.get('loc');
      if (loc) state.loc = loc;
      var z = parseFloat(params.get('z'));
      var lat = parseFloat(params.get('lat'));
      var lng = parseFloat(params.get('lng'));
      if (!isNaN(z) && !isNaN(lat) && !isNaN(lng)) {
        state.z = z;
        state.lat = lat;
        state.lng = lng;
      }
      return state;
    }

    function buildShareUrl() {
      syncHashToUrl();
      return location.href;
    }

    function syncHashToUrl() {
      if (suppressHashUpdate || !map) return;
      var center = map.getCenter();
      var params = new URLSearchParams();
      params.set('z', String(map.getZoom()));
      params.set('lat', center.lat.toFixed(5));
      params.set('lng', center.lng.toFixed(5));
      if (activeId) params.set('loc', activeId);
      var next = location.pathname + location.search + '#' + params.toString();
      if (location.pathname + location.search + location.hash !== next) {
        history.replaceState(null, '', next);
      }
    }

    function scheduleHashSync() {
      clearTimeout(hashSyncTimer);
      hashSyncTimer = setTimeout(syncHashToUrl, 300);
    }

    function applyHashState(state) {
      suppressHashUpdate = true;
      function finish() {
        suppressHashUpdate = false;
        syncHashToUrl();
        updateSidebarForMapView();
      }

      if (!state) {
        finish();
        return;
      }

      if (state.lat != null && state.lng != null && state.z != null) {
        map.setView([state.lat, state.lng], state.z, { animate: false });
      }

      if (state.loc && locById[state.loc]) {
        clusterGroup.zoomToShowLayer(markers[state.loc], function () {
          openLocation(locById[state.loc]);
          finish();
        });
        return;
      }

      if (activeId) {
        panel.classList.remove('open');
        panel.setAttribute('aria-hidden', 'true');
        backdrop.classList.remove('open');
        backdrop.hidden = true;
        activeId = null;
        document.querySelectorAll('.loc-btn').forEach(function (btn) {
          btn.classList.remove('active');
        });
        document.getElementById('panel-embed').innerHTML =
          '<p class="embed-loading">Select a location on the map.</p>';
        document.getElementById('panel-share-btn').hidden = true;
      }
      finish();
    }

    function shareCurrentView(placeTitle) {
      var url = buildShareUrl();
      var title = placeTitle ? placeTitle + ' — Trippin' : 'Trippin map';
      var text = placeTitle ? placeTitle + ' on Trippin' : 'Saved places map';
      if (navigator.share) {
        return navigator.share({ title: title, text: text, url: url }).catch(function (err) {
          if (err && err.name === 'AbortError') return;
          return copyShareUrl(url);
        });
      }
      return copyShareUrl(url);
    }

    function copyShareUrl(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(url).then(function () {
          showShareToast('Link copied');
        });
      }
      showShareToast(url);
    }

    function googleMapsPlaceUrl(loc) {
      if (loc.googleMaps) return loc.googleMaps;
      var q = encodeURIComponent(loc.title + (loc.region ? ', ' + loc.region.split('·')[0].trim() : ''));
      return 'https://www.google.com/maps/search/?api=1&query=' + q;
    }

    function googleMapsEmbedUrl(loc) {
      if (loc.googleMapsEmbed) return loc.googleMapsEmbed;
      var q = encodeURIComponent(loc.title + (loc.region ? ', ' + loc.region.split('·')[0].trim() : ''));
      return 'https://maps.google.com/maps?q=' + q + '&z=14&output=embed';
    }

    function renderPanel(loc) {
      var container = document.getElementById('panel-embed');
      var mapsPage = googleMapsPlaceUrl(loc);
      var html =
        '<p class="panel-section-label">Google Maps</p>' +
        '<div class="panel-gmaps-wrap">' +
        '<iframe title="Google Maps: ' + loc.title.replace(/"/g, '') + '" ' +
        'loading="lazy" referrerpolicy="strict-origin-when-cross-origin" ' +
        'src="' + googleMapsEmbedUrl(loc) + '"></iframe></div>' +
        '<p class="panel-gmaps-link"><a href="' + mapsPage + '" target="_blank" rel="noopener">View ratings &amp; photos on Google Maps ↗</a></p>';

      if (loc.instagram) {
        html +=
          '<p class="panel-section-label">Instagram</p>' +
          '<div class="panel-instagram-wrap">' +
          '<blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="' +
          loc.instagram + '" data-instgrm-version="14"></blockquote></div>';
      }

      container.innerHTML = html;

      if (loc.instagram) {
        function process() {
          if (window.instgrm && window.instgrm.Embeds) {
            window.instgrm.Embeds.process();
          }
        }
        if (window.instgrm) {
          process();
        } else {
          var check = setInterval(function () {
            if (window.instgrm) {
              clearInterval(check);
              process();
            }
          }, 100);
          setTimeout(function () { clearInterval(check); }, 10000);
        }
      }
    }

    function openLocation(loc) {
      activeId = loc.id;
      document.getElementById('panel-title').textContent = loc.title;
      document.getElementById('panel-region').textContent = loc.region;
      document.getElementById('panel-notes').textContent = loc.notes;
      document.getElementById('panel-maps').href = googleMapsPlaceUrl(loc);
      document.getElementById('panel-share-btn').hidden = false;

      renderPanel(loc);

      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      backdrop.hidden = false;
      backdrop.classList.add('open');

      document.querySelectorAll('.loc-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.id === loc.id);
      });
      if (markers[loc.id]) {
        markers[loc.id].openPopup();
      }
      scheduleHashSync();
      scheduleSidebarUpdate();
      updateSidebarForMapView();
    }

    function closePanel() {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      backdrop.classList.remove('open');
      backdrop.hidden = true;
      activeId = null;
      document.querySelectorAll('.loc-btn').forEach(function (btn) {
        btn.classList.remove('active');
      });
      document.getElementById('panel-embed').innerHTML =
        '<p class="embed-loading">Select a location on the map.</p>';
      document.getElementById('panel-share-btn').hidden = true;
      scheduleHashSync();
      updateSidebarForMapView();
    }

    document.getElementById('panel-close').addEventListener('click', closePanel);
    backdrop.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closePanel();
    });

    /* Sidebar list */
    sidebarHint = document.createElement('p');
    sidebarHint.className = 'sidebar-hint';
    sidebarHint.id = 'sidebar-hint';
    sidebar.appendChild(sidebarHint);
    LOCATIONS.forEach(function (loc) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'loc-btn';
      btn.dataset.id = loc.id;
      btn.innerHTML = '<span class="title">' + loc.title + '</span><span class="region">' + loc.region + '</span>';
      btn.addEventListener('click', function () {
        clusterGroup.zoomToShowLayer(markers[loc.id], function () {
          openLocation(loc);
        });
      });
      locButtons[loc.id] = btn;
      sidebar.appendChild(btn);
    });

    /* Map */
    var map = L.map('map', {
      scrollWheelZoom: true,
      touchZoom: true,
      doubleClickZoom: true,
      tap: false,
      tapTolerance: 20
    }).setView([37.5, -118.5], 5);

    (function enableMobileDoubleTapZoom() {
      var lastTap = 0;
      var lastX = 0;
      var lastY = 0;
      var delayMs = 320;
      var maxPx = 28;

      map.getContainer().addEventListener('touchend', function (e) {
        if (e.touches.length > 0) return;
        if (e.target.closest('.leaflet-marker-icon, .marker-cluster, .leaflet-control')) return;

        var touch = e.changedTouches[0];
        var now = Date.now();
        var x = touch.clientX;
        var y = touch.clientY;
        var dx = x - lastX;
        var dy = y - lastY;

        if (lastTap && now - lastTap < delayMs && dx * dx + dy * dy < maxPx * maxPx) {
          e.preventDefault();
          var point = map.mouseEventToContainerPoint(touch);
          var latlng = map.containerPointToLatLng(point);
          var nextZoom = Math.min(map.getMaxZoom(), map.getZoom() + 1);
          map.setView(latlng, nextZoom, { animate: true });
          lastTap = 0;
          return;
        }

        lastTap = now;
        lastX = x;
        lastY = y;
      }, { passive: false });
    })();
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var bounds = L.latLngBounds();
    var defaultBoundsOptions = { padding: [40, 40], maxZoom: 7 };

    function resetToHome() {
      suppressHashUpdate = true;
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      backdrop.classList.remove('open');
      backdrop.hidden = true;
      activeId = null;
      document.querySelectorAll('.loc-btn').forEach(function (btn) {
        btn.classList.remove('active');
      });
      document.getElementById('panel-embed').innerHTML =
        '<p class="embed-loading">Select a location on the map.</p>';
      document.getElementById('panel-share-btn').hidden = true;
      history.replaceState(null, '', location.pathname + location.search);
      map.closePopup();
      map.fitBounds(bounds, defaultBoundsOptions);
      map.once('moveend', function () {
        history.replaceState(null, '', location.pathname + location.search);
        suppressHashUpdate = false;
        updateSidebarForMapView();
      });
    }

    var clusterGroup = L.markerClusterGroup({
      maxClusterRadius: 48,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
      iconCreateFunction: function (cluster) {
        var count = cluster.getChildCount();
        var sizeClass = count < 5 ? 'marker-cluster-sm' : count < 10 ? 'marker-cluster-md' : 'marker-cluster-lg';
        return L.divIcon({
          html: '<div><span>' + count + '</span></div>',
          className: 'marker-cluster ' + sizeClass,
          iconSize: L.point(40, 40)
        });
      }
    });

    LOCATIONS.forEach(function (loc) {
      bounds.extend([loc.lat, loc.lng]);
      var marker = L.marker([loc.lat, loc.lng], {
        icon: L.divIcon({
          className: 'pin-emoji',
          html: '<span aria-hidden="true">🥾</span>',
          iconSize: [24, 24],
          iconAnchor: [12, 22]
        })
      });
      marker.bindPopup('<strong>' + loc.title + '</strong><br><span style="font-size:12px;color:#666">Click pin again or use list</span>');
      marker.on('click', function () {
        openLocation(loc);
      });
      markers[loc.id] = marker;
      clusterGroup.addLayer(marker);
    });
    map.addLayer(clusterGroup);

    map.on('moveend zoomend resize', function () {
      scheduleHashSync();
      scheduleSidebarUpdate();
    });

    var initialHash = parseHashState();
    if (initialHash && (initialHash.loc || initialHash.lat != null)) {
      applyHashState(initialHash);
    } else {
      map.fitBounds(bounds, defaultBoundsOptions);
      map.once('moveend', updateSidebarForMapView);
    }

    window.addEventListener('hashchange', function () {
      applyHashState(parseHashState());
    });

    document.getElementById('home-btn').addEventListener('click', resetToHome);
    document.getElementById('header-share-btn').addEventListener('click', function () {
      shareCurrentView(activeId && locById[activeId] ? locById[activeId].title : null);
    });
    document.getElementById('panel-share-btn').addEventListener('click', function () {
      if (activeId && locById[activeId]) {
        shareCurrentView(locById[activeId].title);
      }
    });
  </script>
</body>
</html>
