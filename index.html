<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locations — map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      --bg: #f7f5f0;
      --paper: #fff;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #ddd8ce;
      --accent: #3d6b8c;
      --accent-hover: #2d5068;
      --overlay: rgba(26, 26, 26, 0.35);
      --header-h: 52px;
      --sidebar-w: 280px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
      overflow: hidden;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    header {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1rem;
      background: var(--paper);
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }
    .build-meta {
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    .sidebar {
      width: var(--sidebar-w);
      flex-shrink: 0;
      background: var(--paper);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }
    .sidebar-hint {
      padding: 0.65rem 0.85rem;
      font-size: 0.75rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .loc-btn {
      display: block;
      width: 100%;
      text-align: left;
      padding: 0.75rem 0.85rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: var(--paper);
      cursor: pointer;
      font: inherit;
      color: inherit;
    }
    .loc-btn:hover,
    .loc-btn.active {
      background: #eef3f6;
    }
    .loc-btn.active {
      border-left: 3px solid var(--accent);
      padding-left: calc(0.85rem - 3px);
    }
    .loc-btn .title {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .loc-btn .region {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    #map {
      flex: 1;
      min-width: 0;
      background: #e8e4dc;
    }
    .pin-emoji {
      background: none;
      border: none;
    }
    .pin-emoji span {
      display: block;
      font-size: 1.5rem;
      line-height: 1;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
      cursor: pointer;
    }
    /* Floating panel */
    .panel {
      position: fixed;
      top: var(--header-h);
      right: 0;
      width: min(420px, 100vw);
      height: calc(100% - var(--header-h));
      background: var(--paper);
      border-left: 1px solid var(--line);
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.12);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform 0.22s ease;
    }
    .panel.open {
      transform: translateX(0);
    }
    .panel-backdrop {
      position: fixed;
      inset: var(--header-h) 0 0 0;
      background: var(--overlay);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .panel-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }
    .panel-header {
      display: flex;
      align-items: flex-start;
      gap: 0.5rem;
      padding: 0.85rem 1rem;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-header-text { flex: 1; min-width: 0; }
    .panel-header h2 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.3;
    }
    .panel-header .region {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.2rem;
    }
    .panel-close {
      flex-shrink: 0;
      width: 2rem;
      height: 2rem;
      border: 1px solid var(--line);
      border-radius: 4px;
      background: var(--paper);
      cursor: pointer;
      font-size: 1.25rem;
      line-height: 1;
      color: var(--muted);
    }
    .panel-close:hover { background: var(--bg); color: var(--ink); }
    .panel-notes {
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-embed {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem;
      background: #fafafa;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .panel-section-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0;
    }
    .panel-gmaps-wrap {
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #e8e4dc;
      flex-shrink: 0;
    }
    .panel-gmaps-wrap iframe {
      display: block;
      width: 100%;
      height: 200px;
      border: 0;
    }
    .panel-gmaps-link {
      margin: 0;
      font-size: 0.8rem;
      flex-shrink: 0;
    }
    .panel-gmaps-link a {
      color: var(--accent);
    }
    .panel-gmaps-link a:hover {
      color: var(--accent-hover);
    }
    .panel-instagram-wrap {
      flex-shrink: 0;
    }
    .panel-embed .instagram-media {
      margin: 0 !important;
      min-width: 280px !important;
      width: 100% !important;
      max-width: 100% !important;
    }
    .panel-embed .embed-loading {
      color: var(--muted);
      font-size: 0.875rem;
      padding: 2rem 1rem;
      text-align: center;
    }
    .panel-footer {
      padding: 0.65rem 1rem;
      border-top: 1px solid var(--line);
      flex-shrink: 0;
    }
    .panel-footer a {
      font-size: 0.8rem;
      color: var(--accent);
    }
    .panel-footer a:hover { color: var(--accent-hover); }
    @media (max-width: 720px) {
      .sidebar { display: none; }
      .panel { width: 100vw; }
    }
  </style>
</head>

    var panel = document.getElementById('panel');
    var backdrop = document.getElementById('backdrop');
    var sidebar = document.getElementById('sidebar');
    var markers = {};
    var activeId = null;

    function googleMapsPlaceUrl(loc) {
      if (loc.googleMaps) return loc.googleMaps;
      var q = encodeURIComponent(loc.title + (loc.region ? ', ' + loc.region.split('·')[0].trim() : ''));
      return 'https://www.google.com/maps/search/?api=1&query=' + q;
    }

    function googleMapsEmbedUrl(loc) {
      if (loc.googleMapsEmbed) return loc.googleMapsEmbed;
      var q = encodeURIComponent(loc.title + (loc.region ? ', ' + loc.region.split('·')[0].trim() : ''));
      return 'https://maps.google.com/maps?q=' + q + '&z=14&output=embed';
    }

    function renderPanel(loc) {
      var container = document.getElementById('panel-embed');
      var mapsPage = googleMapsPlaceUrl(loc);
      var html =
        '<p class="panel-section-label">Google Maps</p>' +
        '<div class="panel-gmaps-wrap">' +
        '<iframe title="Google Maps: ' + loc.title.replace(/"/g, '') + '" ' +
        'loading="lazy" referrerpolicy="strict-origin-when-cross-origin" ' +
        'src="' + googleMapsEmbedUrl(loc) + '"></iframe></div>' +
        '<p class="panel-gmaps-link"><a href="' + mapsPage + '" target="_blank" rel="noopener">View ratings &amp; photos on Google Maps ↗</a></p>';

      if (loc.instagram) {
        html +=
          '<p class="panel-section-label">Instagram</p>' +
          '<div class="panel-instagram-wrap">' +
          '<blockquote class="instagram-media" data-instgrm-captioned data-instgrm-permalink="' +
          loc.instagram + '" data-instgrm-version="14"></blockquote></div>';
      }

      container.innerHTML = html;

      if (loc.instagram) {
        function process() {
          if (window.instgrm && window.instgrm.Embeds) {
            window.instgrm.Embeds.process();
          }
        }
        if (window.instgrm) {
          process();
        } else {
          var check = setInterval(function () {
            if (window.instgrm) {
              clearInterval(check);
              process();
            }
          }, 100);
          setTimeout(function () { clearInterval(check); }, 10000);
        }
      }
    }

    function openLocation(loc) {
      activeId = loc.id;
      document.getElementById('panel-title').textContent = loc.title;
      document.getElementById('panel-region').textContent = loc.region;
      document.getElementById('panel-notes').textContent = loc.notes;
      document.getElementById('panel-maps').href = googleMapsPlaceUrl(loc);

      renderPanel(loc);

      panel.classList.add('open');
      panel.setAttribute('aria-hidden', 'false');
      backdrop.hidden = false;
      backdrop.classList.add('open');

      document.querySelectorAll('.loc-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.id === loc.id);
      });
      if (markers[loc.id]) {
        markers[loc.id].openPopup();
      }
    }

    function closePanel() {
      panel.classList.remove('open');
      panel.setAttribute('aria-hidden', 'true');
      backdrop.classList.remove('open');
      backdrop.hidden = true;
      activeId = null;
      document.querySelectorAll('.loc-btn').forEach(function (btn) {
        btn.classList.remove('active');
      });
      document.getElementById('panel-embed').innerHTML =
        '<p class="embed-loading">Select a location on the map.</p>';
    }

    document.getElementById('panel-close').addEventListener('click', closePanel);
    backdrop.addEventListener('click', closePanel);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closePanel();
    });

    /* Sidebar list */
    sidebar.innerHTML = '<p class="sidebar-hint">' + LOCATIONS.length + ' saved spots</p>';
    LOCATIONS.forEach(function (loc) {
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'loc-btn';
      btn.dataset.id = loc.id;
      btn.innerHTML = '<span class="title">' + loc.title + '</span><span class="region">' + loc.region + '</span>';
      btn.addEventListener('click', function () {
        openLocation(loc);
        map.setView([loc.lat, loc.lng], 10, { animate: true });
      });
      sidebar.appendChild(btn);
    });

    /* Map */
    var map = L.map('map', { scrollWheelZoom: true }).setView([37.5, -118.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    var bounds = L.latLngBounds();
    LOCATIONS.forEach(function (loc) {
      bounds.extend([loc.lat, loc.lng]);
      var marker = L.marker([loc.lat, loc.lng], {
        icon: L.divIcon({
          className: 'pin-emoji',
          html: '<span aria-hidden="true">🌲</span>',
          iconSize: [24, 24],
          iconAnchor: [12, 22]
        })
      }).addTo(map);
      marker.bindPopup('<strong>' + loc.title + '</strong><br><span style="font-size:12px;color:#666">Click pin again or use list</span>');
      marker.on('click', function () {
        openLocation(loc);
      });
      markers[loc.id] = marker;
    });
    map.fitBounds(bounds, { padding: [40, 40], maxZoom: 7 });
  </script>
</body>
</html>
